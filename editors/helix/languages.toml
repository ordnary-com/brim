# Add this to ~/.config/helix/languages.toml, and copy runtime/queries/brim
# to ~/.config/helix/runtime/queries/brim. Then run
#   hx --grammar fetch && hx --grammar build

[[language]]
name = "brim"
scope = "source.brim"
file-types = ["brim"]
roots = ["brim.toml"]
comment-token = "//"
indent = { tab-width = 4, unit = "    " }
language-servers = ["brim"]
auto-format = true

[language-server.brim]
command = "brim"
args = ["lsp"]

[[grammar]]
name = "brim"
source = { git = "https://github.com/ordnary-com/brim", rev = "1cc48a671bda02e7c61d8ba1a713cb9190dca257", subpath = "editors/tree-sitter-brim" }
