# Brim syntax for micro: copy to ~/.config/micro/syntax/brim.yaml
filetype: brim

detect:
    filename: "\\.brim$"

rules:
    - statement: "\\b(fn|let|mut|return|if|else|while|for|in|match|break|continue|struct|enum|impl|pub|import|as)\\b"
    - error: "\\b(async|await|const|loop|trait|type|use)\\b"
    - type: "\\b(i64|i32|u8|u64|f64|bool|string|void|Option|Result|List|Map|Set|Box)\\b"
    - type: "\\b[A-Z][A-Za-z0-9_]*\\b"
    - constant.bool: "\\b(true|false)\\b"
    - constant: "\\b(self|Some|None|Ok|Err)\\b"
    - identifier: "\\b(print|eprint|to_string|to_float|to_int|to_i32|to_u8|to_u64|string_from_bytes|from_code_point|serve_api|abs|sqrt|floor|ceil|round|pow|min|max|clamp|read_line|read_file|write_file|args|env|exit|assert|assert_eq)\\b"
    - constant.number: "\\b[0-9][0-9_]*(\\.[0-9][0-9_]*)?([eE][+-]?[0-9]+)?\\b"
    - constant.string:
        start: "\""
        end: "\""
        skip: "\\\\."
        rules:
            - constant.specialChar: "\\\\([nrt0\"\\\\]|u\\{[0-9a-fA-F]+\\})"
    - comment:
        start: "//"
        end: "$"
        rules:
            - todo: "(TODO|FIXME|XXX):?"
