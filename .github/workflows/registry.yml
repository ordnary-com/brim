name: Registry

# Typechecks and tests the package registry service (registry/).
on:
  push:
    branches: [main]
    paths: ["registry/**", ".github/workflows/registry.yml"]
  pull_request:
    paths: ["registry/**", ".github/workflows/registry.yml"]

permissions:
  contents: read

concurrency:
  group: registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: registry/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
