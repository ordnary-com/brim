name: Site

# Builds the documentation site (site/, with mdBook) on every change, and
# publishes it to GitHub Pages when the repository variable SITE_DEPLOY is
# "true" (Pages must use "GitHub Actions" as its source).
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: 0.4.52

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: mdbook build site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/book

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main' && vars.SITE_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
