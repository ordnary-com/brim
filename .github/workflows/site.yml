name: Site

# Builds brimlang.com on every change: the landing page (site/landing/) at
# the root, the documentation (site/, with mdBook) under /docs/ and the
# install scripts. It
# publishes them to GitHub Pages when the repository variable SITE_DEPLOY is
# "true" (Pages must use "GitHub Actions" as its source).
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "crates/**", ".cargo/**", "install.sh", "install.ps1", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "docs/**", "crates/**", ".cargo/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: 0.4.52

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: mdbook build site
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Add the standard library reference (brim doc --std)
        run: cargo run -q --locked -p brim-cli -- doc --std -o site/book/docs/std
      - name: Add the landing page and the install scripts
        run: |
          cp -R site/landing/. site/book/
          # `curl -fsSL https://brimlang.com/install.sh | sh`
          cp install.sh install.ps1 site/book/
          # The guide pages used to live at the root; send old links on.
          for page in introduction getting-started playground tour projects tools stdlib print; do
            printf '<!doctype html><meta charset="utf-8"><title>Moved</title><meta http-equiv="refresh" content="0; url=docs/%s.html"><link rel="canonical" href="docs/%s.html"><a href="docs/%s.html">Moved to docs/%s.html</a>\n' \
              "$page" "$page" "$page" "$page" > "site/book/$page.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/book

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main' && vars.SITE_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
