name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked --no-fail-fast
      - name: Run the examples
        shell: bash
        run: |
          for f in examples/*.brim; do
            cargo run -q -p brim-cli -- run "$f"
          done
          cargo run -q -p brim-cli -- run examples/project

  native:
    name: Native backend (LLVM 22, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install LLVM 22 (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo apt-get install -y libpolly-22-dev libzstd-dev libcurl4-openssl-dev
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
      - name: Install LLVM 22 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@22
          echo "LLVM_SYS_221_PREFIX=$(brew --prefix llvm@22)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: llvm22
      - run: cargo clippy --workspace --all-targets --locked --features brim-cli/llvm -- -D warnings
      - run: cargo test --workspace --locked --features brim-cli/llvm
      - name: Build and run the examples natively
        shell: bash
        run: |
          for f in examples/*.brim; do
            cargo run -q -p brim-cli --features llvm -- build --release -o "target/native/$(basename "$f" .brim)" "$f"
            "target/native/$(basename "$f" .brim)"
          done

  postgres:
    name: Postgres client
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: brim
          POSTGRES_PASSWORD: brimpass
          POSTGRES_DB: brimtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      BRIM_TEST_POSTGRES: postgres://brim:brimpass@127.0.0.1:5432/brimtest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p brim-cli --test fixtures postgres_programs -- --nocapture

  editors:
    name: Editor support
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The tree-sitter parser matches grammar.js
        working-directory: editors/tree-sitter-brim
        run: |
          npm install --no-save tree-sitter-cli@0.25.10
          npx tree-sitter generate
          git diff --exit-code -- src
          npx tree-sitter test
      - name: Every example and test program parses
        run: |
          git ls-files '*.brim' | grep -E '^(examples|tests/integration|tests/modules)/' | sed 's|^|../../|' > /tmp/programs.txt
          cd editors/tree-sitter-brim
          npx tree-sitter parse -q --paths /tmp/programs.txt
      - name: The query copies are up to date
        run: |
          python3 editors/sync-queries.py
          git diff --exit-code -- editors
      - name: The Emacs mode compiles and highlights the examples
        run: |
          sudo apt-get install -y -qq emacs-nox > /dev/null
          emacs --batch -Q -L editors/emacs -f batch-byte-compile editors/emacs/brim-mode.el
          for f in examples/*.brim; do
            emacs --batch -Q -L editors/emacs -l brim-mode "$f" \
              --eval '(progn (unless (eq major-mode (quote brim-mode)) (error "not brim-mode")) (font-lock-ensure) (indent-region (point-min) (point-max)))'
          done
      - uses: dtolnay/rust-toolchain@stable
      - name: The Zed extension compiles
        working-directory: editors/zed
        run: cargo check

  editors-live:
    name: Editors (Neovim, Helix, Kakoune, nano, micro, Kate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p brim-cli
      - name: Install the editors
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq kakoune nano micro libkf5syntaxhighlighting-tools > /dev/null
          mkdir -p "$HOME/editors"
          curl -fsSL https://github.com/neovim/neovim/releases/download/v0.11.4/nvim-linux-x86_64.tar.gz | tar xz -C "$HOME/editors"
          curl -fsSL https://github.com/helix-editor/helix/releases/download/25.07.1/helix-25.07.1-x86_64-linux.tar.xz | tar xJ -C "$HOME/editors"
          echo "$HOME/editors/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "$HOME/editors/helix-25.07.1-x86_64-linux" >> "$GITHUB_PATH"
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
      - run: editors/test/run.sh

  container:
    name: Example service in a container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t notes examples/http
      - name: Run it and call the API
        run: |
          docker run -d --name notes -p 8080:8080 notes
          for i in $(seq 30); do curl -sf localhost:8080/notes > /dev/null && break; sleep 1; done
          created=$(curl -sf -X POST localhost:8080/notes -d '{"text": "from CI"}')
          echo "$created"
          [ "$created" = '{"id":1,"text":"from CI"}' ]
          [ "$(curl -sf localhost:8080/notes)" = '[{"id":1,"text":"from CI"}]' ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/nope)" = 404 ]
          docker logs notes
          docker rm -f notes

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked
