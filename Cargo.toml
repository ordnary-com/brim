[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0-rc.2"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/ordnary-com/brim"
authors = ["Ordnary"]

[workspace.dependencies]
brim-ast = { path = "crates/brim-ast" }
brim-codegen = { path = "crates/brim-codegen" }
brim-cli = { path = "crates/brim-cli" }
brim-doc = { path = "crates/brim-doc" }
brim-llvm-extra = { path = "crates/brim-llvm-extra" }
brim-diagnostics = { path = "crates/brim-diagnostics" }
brim-driver = { path = "crates/brim-driver" }
brim-fmt = { path = "crates/brim-fmt" }
brim-interp = { path = "crates/brim-interp" }
brim-ir = { path = "crates/brim-ir" }
brim-lexer = { path = "crates/brim-lexer" }
brim-lower = { path = "crates/brim-lower" }
brim-lsp = { path = "crates/brim-lsp" }
brim-manifest = { path = "crates/brim-manifest" }
brim-package = { path = "crates/brim-package" }
brim-parser = { path = "crates/brim-parser" }
brim-runtime = { path = "crates/brim-runtime" }
brim-semantic = { path = "crates/brim-semantic" }
brim-stdlib = { path = "crates/brim-stdlib" }
brim-tsgen = { path = "crates/brim-tsgen" }

inkwell = { version = "=0.10.0", default-features = false, features = ["llvm22-1", "target-x86", "target-aarch64"] }
curl = "=0.4.51"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tar = { version = "=0.4.46", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
