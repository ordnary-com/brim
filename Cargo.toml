[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/ordnary-com/brim"
authors = ["Ordnary"]

[workspace.dependencies]
brim-ast = { path = "crates/brim-ast" }
brim-codegen = { path = "crates/brim-codegen" }
brim-diagnostics = { path = "crates/brim-diagnostics" }
brim-fmt = { path = "crates/brim-fmt" }
brim-interp = { path = "crates/brim-interp" }
brim-ir = { path = "crates/brim-ir" }
brim-lexer = { path = "crates/brim-lexer" }
brim-lower = { path = "crates/brim-lower" }
brim-manifest = { path = "crates/brim-manifest" }
brim-parser = { path = "crates/brim-parser" }
brim-runtime = { path = "crates/brim-runtime" }
brim-semantic = { path = "crates/brim-semantic" }
brim-stdlib = { path = "crates/brim-stdlib" }

inkwell = { version = "=0.10.0", default-features = false, features = ["llvm22-1", "target-x86", "target-aarch64"] }
serde = { version = "=1.0.229", features = ["derive"] }
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
