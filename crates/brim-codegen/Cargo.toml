[package]
name = "brim-codegen"
description = "Code generation backend interface for the Brim compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# The LLVM backend. Needs LLVM 22 installed (see docs/development.md).
llvm = ["dep:inkwell", "dep:brim-llvm-extra", "brim-llvm-extra/llvm"]
# The LLVM backend with LLVM linked statically, for release binaries.
llvm-static = ["llvm", "inkwell/llvm22-1-force-static"]

[dependencies]
brim-diagnostics.workspace = true
brim-ir.workspace = true
brim-runtime.workspace = true
inkwell = { workspace = true, optional = true }
brim-llvm-extra = { workspace = true, optional = true }

[lints]
workspace = true
